<style>
:root{--bg:#EAF0F4;--card:#fff;--tx:#0B1220;--mut:#5B6779;--line:#d3dce5;--ac:#2F6BFF;--rest:#E8960C;--ok:#1FA46B;--sk:#9AA5B5}
:root[data-theme=dark]{--bg:#0B1220;--card:#141D30;--tx:#EEF3FA;--mut:#8D9BB3;--line:#243049;--ac:#5B8CFF;--rest:#FFB020;--ok:#3DD08F;--sk:#5C6880}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#141D30;--tx:#EEF3FA;--mut:#8D9BB3;--line:#243049;--ac:#5B8CFF;--rest:#FFB020;--ok:#3DD08F;--sk:#5C6880}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0;overflow-x:hidden}
main{padding:16px 18px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font:800 34px/1.1 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.03em;margin:8px 0 4px}
h2{font-size:20px;margin:22px 0 10px;letter-spacing:-.01em}
.mut{color:var(--mut)}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats b{display:block;font-size:26px;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:var(--line);border-radius:16px;min-height:52px;padding:0 18px;font-weight:600}
button.p{background:var(--ac);color:#fff;width:100%;min-height:64px;font-size:20px;border-radius:20px}
button.d{background:none;color:#E5484D}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{min-height:44px;background:none;border-radius:11px}.seg button.on{background:var(--card);box-shadow:0 1px 3px #0003}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border-radius:0;min-height:58px;color:var(--mut);font-size:13px}nav button.on{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px;border:2px solid transparent;padding:0}
.day small{font-size:11px;font-weight:500;color:var(--mut)}
.day.rest{background:none;border:2px dashed var(--rest);color:var(--rest)}.day.done{background:var(--ok);color:#fff}.day.done small{color:#fffc}
.day.skip{color:var(--sk);text-decoration:line-through}.day.cur{border-color:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet>div{background:var(--bg);width:100%;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.hide{display:none!important}
#tr{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));transition:background .2s}
#tr.rest{--ac:var(--rest)}
#flash{text-align:center;font:800 26px system-ui;height:34px;color:var(--ac)}
#anim{width:100%;max-height:30vh;flex:none}#anim line,#anim circle{stroke:var(--tx)}#anim circle{fill:var(--bg);stroke-width:5}
#tm{font:800 92px/1 -apple-system,"SF Pro Display";letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}.ctl button{font-size:13px;min-height:60px;padding:0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}

main{padding-bottom:calc(120px + env(safe-area-inset-bottom));animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{margin:14px 0}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-height:62px}nav svg{width:24px;height:24px}
nav button.on::before{content:"";position:absolute;top:0;width:30px;height:3px;border-radius:2px;background:var(--ac)}
.ringw{position:relative;display:grid;place-items:center}.ring{width:210px;height:210px}.ringw #tm{position:absolute;font-size:62px}
.ringw.pulse{animation:pl .5s infinite alternate}@keyframes pl{to{transform:scale(1.05)}}
#anim{flex:1;min-height:0;max-height:none;height:auto}
#flash{opacity:0;color:#fff;background:var(--ac);border-radius:14px;padding:4px 18px;width:max-content;margin:4px auto;font-size:20px;height:auto;min-height:34px;transition:opacity .3s}
.nxc{background:var(--card);border-radius:16px;padding:10px 14px;text-align:center;font-weight:600}
.ctl{grid-template-columns:2fr 1fr 1fr;margin-top:10px}.ctl button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.ctl small{font-size:12px;font-weight:600}.ctl #bP{font-size:20px}
.hero{display:flex;gap:18px;align-items:center}.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.pill{flex:0 0 52px;background:var(--card);border-radius:16px;padding:8px 0;text-align:center;border:2px solid transparent}.pill small{display:block;font-size:11px;color:var(--mut)}.pill.rest{border:2px dashed var(--rest)}.pill.cur{border-color:var(--ac)}
.sw{width:52px;min-height:32px;height:32px;border-radius:16px;padding:0;position:relative}.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on i{left:23px}
</style></head><body>

 <div style="text-align:center"><div id="nm" style="font:800 28px system-ui;letter-spacing:-.02em"></div><div id="vr" class="mut"></div></div>

 let h='';if(S)h+=`<div class="card"><b>Unterbrochenes Training</b><br><span class="mut">Tag ${S.day} · noch ${fmt(S.remain/1000)} im aktuellen Abschnitt</span><br><br><button class="p" onclick="resumeUI()">Fortsetzen</button></div>`;
 if(d>30)return h+'<h1>Geschafft.</h1><p class="mut">Alle Trainingstage des Programms sind abgeschlossen oder übersprungen.</p>';
 const lr=hist.filter(z=>z.status==='done'&&z.fb&&z.fb.r!==undefined).slice(-2),warn=lr.length==2&&lr[0].fb.r==2&&lr[1].fb.r==2?'<div class="card"><b>Hohe Belastung</b><br><span class="mut">Die letzten zwei Einheiten waren zu schwer. Erwäge eine leichtere Einheit: Senke die Stufe unter Mehr mit −.</span></div>':'';
 const C=2*Math.PI*46,strip=Array.from({length:7},(_,i)=>d+i).filter(x=>x<=30).map(x=>`<div class="pill ${x===d?'cur':''} ${MX[x].rest?'rest':''}"><small>${MX[x].rest?'Ruhe':'Tag'}</small><b>${x}</b></div>`).join('');
 return h+`<h1>Tag ${d} von 30</h1><div class="mut">${D.has(d)?'Absolviert':'Heute geplant'} · Stufe ${meta.stage}</div>
 <div class="card hero"><div class="ringw" style="flex:none"><svg viewBox="0 0 110 110" width="116" height="116"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="55" cy="55" r="46" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/24)}" transform="rotate(-90 55 55)"/></svg><div style="position:absolute;text-align:center;line-height:1.1"><b style="font-size:28px">${n}</b><br><small class="mut">von 24</small></div></div>
 <div style="flex:1"><b>Noch ${tr} Trainingstage</b><div class="mut" style="margin-top:6px">${nr?'Nächste Ruhe: Tag '+nr:'Keine Ruhetage mehr'}</div></div></div>
 <div class="strip">${strip}</div>${warn}
 <div class="mut" style="text-align:center;margin:14px 0">${fmt(dur())} Min · 13 Übungen · 1 Runde<br><small>Aufwärmen und Abkühlen bitte außerhalb der App.</small></div>
 <button class="p" onclick="startWorkout(${d})">Training starten</button>`}
const lvSeg=()=>`<h2>Fitnesslevel</h2><div class="seg">${LV.map(l=>`<button class="${level===l?'on':''}" onclick="setLv('${l}')">${LVN[l]}</button>`).join('')}</div><p class="mut" style="font-size:14px">Du kannst das Level jederzeit wechseln. Gespeicherte Ergebnisse bleiben erhalten.</p>`;
window.resumeUI=()=>{unlock();openTr()};
function vCal(){const D=doneDays(),c=curDay();
 return `<h1>Kalender</h1><p class="mut">6 Ruhetage: 5, 9, 13, 18, 22, 27</p><div class="cal">`+Array.from({length:30},(_,i)=>{const d=i+1,r=MX[d].rest;
 const cl=r?'rest':D.has(d)?'done':skips.includes(d)?'skip':'';
 return `<button class="day ${cl} ${d===c?'cur':''}" onclick="dayInfo(${d})">${d}<small>${r?'Ruhe':D.has(d)?'fertig':skips.includes(d)?'übersprungen':'Training'}</small></button>`}).join('')+`</div>`}
window.dayInfo=d=>{const x=MX[d];let h=`<h1 style="font-size:28px">Tag ${d}</h1>`;
 if(x.rest)h+='<p>Ruhetag. Vollständig trainingsfrei – Erholung gehört zum Programm.</p>';
 else{h+='<table><tr><th>Übung</th><th>Belastung</th><th>Pause</th></tr>'+Array.from({length:13},(_,e)=>`<tr><td>${e+1}. ${EX[e]}<br><span class="mut" style="font-size:12px">${varOf(level,e)}</span></td><td>${wOf(e)} s</td><td>${e<12?PAUSE[e]+' s':'–'}</td></tr>`).join('')+`</table><p class="mut">Gesamt ${fmt(durNow())} · Status: ${doneDays().has(d)?'absolviert':skips.includes(d)?'übersprungen':'geplant'}</p>`;
  }
 const can=!x.rest&&d===curDay()&&!doneDays().has(d);
 h+=`<div style="position:sticky;bottom:0;background:var(--bg);padding-top:12px;display:grid;gap:10px">${can?`<button class="p" onclick="closeSh();startWorkout(${d})">Training starten</button>`:`<div class="mut" style="text-align:center;font-size:14px">${x.rest?'':doneDays().has(d)?'Bereits absolviert.':'Nur zur Ansicht. Als Nächstes steht Tag '+curDay()+' an.'}</div>`}<button style="width:100%" onclick="closeSh()">Schließen</button></div>`;$('sh').innerHTML=h;$('sheet').classList.remove('hide')};
window.closeSh=()=>$('sheet').classList.add('hide');
window.toggleSkip=async d=>{skips=skips.includes(d)?skips.filter(x=>x!==d):[...skips,d];await kvSet('skips',skips);closeSh();render()};
function vHis(){const H=hist.slice().reverse(),dn=hist.filter(x=>x.status==='done'),RT=['Zu leicht','Richtig','Zu schwer'];
 const col=r=>r===0?'var(--ac)':r===2?'#E5484D':'var(--ok)',has=x=>x.fb&&x.fb.r!==undefined;
 const mins=Math.round(dn.reduce((a,x)=>a+x.total,0)/60),sp=dn.filter(x=>x.stage!==undefined);let line='';
 if(sp.length>1){const m=Math.max(1,...sp.map(x=>x.stage));line=`<h2>Belastungsstufe</h2><div class="card"><svg viewBox="0 0 300 60" style="width:100%"><polyline fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${sp.map((x,i)=>(i*300/(sp.length-1)).toFixed(1)+','+(55-x.stage/m*50).toFixed(1)).join(' ')}"/></svg></div>`}
 const rw=(n,s)=>`<tr><td>${n}</td><td>${s.segments.reduce((a,x)=>a+(x.work||0),0)} s</td><td>${fmt(s.total)}</td></tr>`;
 const cmp=dn.length>1?`<h2>Erste und letzte Einheit</h2><div class="card"><table><tr><th></th><th>Belastung</th><th>Dauer</th></tr>${rw('Erste',dn[0])}${rw('Letzte',dn[dn.length-1])}</table></div>`:'';
 const list=H.map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0"><div><b>Tag ${x.day}</b> · ${new Date(x.date).toLocaleDateString('de-DE')}<br><span class="mut" style="font-size:14px">${x.segments.filter(s=>s.done).length}/13 Übungen${x.status==='done'?'':' · abgebrochen'}</span></div><div style="text-align:right"><b>${x.status==='done'?fmt(x.total):'–'}</b><br><span style="font-size:13px;color:${has(x)?col(x.fb.r):'var(--mut)'}">${has(x)?RT[x.fb.r]:''}</span></div></div>`).join('')||'<p class="mut">Noch keine Einheiten.</p>';
 const k=(v,t)=>`<div class="card" style="margin:0"><b style="font-size:26px">${v}</b><br><span class="mut">${t}</span></div>`;
 return `<h1>Verlauf</h1><div class="stats">${k(dn.length,'Einheiten')}${k(mins,'Minuten')}${k(meta.stage,'Stufe')}</div>${line}${cmp}<h2>Einheiten</h2>${list}`}
function vSet(){const sw=(on,f)=>`<button class="sw ${on?'on':''}" onclick="${f}"><i></i></button>`;
 return `<h1>Mehr</h1><h2>Training</h2><div class="card"><div class="row" style="border:0"><div><b>Belastungsstufe ${meta.stage}</b><br><span class="mut" style="font-size:13px">Dauer ${fmt(durNow())} · passt sich nach jeder Einheit an</span></div><div style="display:flex;gap:8px"><button onclick="stg(-1)">−</button><button onclick="stg(1)">+</button></div></div></div>${lvSeg()}
 <h2>Ton und Anzeige</h2><div class="card"><div class="row"><span>Töne</span>${sw(snd,'tgSnd()')}</div><div class="row"><span>Ton testen</span><button onclick="testSnd()">Abspielen</button></div><div class="row" style="border:0"><span>Design</span><button onclick="tgTheme()">${{auto:'Automatisch',dark:'Dunkel',light:'Hell'}[theme]}</button></div></div>
 <h2>Daten</h2><div class="card"><div class="row"><span>Export (JSON)</span><button onclick="exp()">Export</button></div><div class="row" style="border:0"><span>Alle Daten löschen</span><button class="d" onclick="wipe()">Löschen</button></div></div>
 <p class="mut" style="font-size:13px">Alle Daten bleiben auf diesem Gerät. Keine Registrierung, keine Cloud, kein Tracking. Beim Wechsel in eine andere App pausiert das Training automatisch.</p>`}
window.testSnd=()=>{unlock().then(()=>{if(!snd){alert('Töne sind ausgeschaltet.');return}cue('ws');setTimeout(()=>cue('re'),600)})};
window.tgSnd=()=>{snd=!snd;kvSet('snd',snd);unlock();if(snd)beep(880);render()};
window.tgTheme=()=>{theme={auto:'dark',dark:'light',light:'auto'}[theme];kvSet('theme',theme);applyTheme();render()};
window.exp=async()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),level,skips,history:hist,prog},null,1)],{type:'application/json'});const f=new File([blob],'fit30-export.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit30-export.json';a.click()};
window.wipe=async()=>{if(!confirm('Wirklich alle Trainingsdaten löschen?'))return;const d=await db;d.close();indexedDB.deleteDatabase('fit30');location.reload()};
/* ---------- Start ---------- */
(async()=>{try{level=(await kvGet('level'))||'F';skips=(await kvGet('skips'))||[];prog=(await kvGet('prog'))||defProg(level);meta=(await kvGet('meta'))||{ptr:0,stage:0};snd=(await kvGet('snd'))!==false;theme=(await kvGet('theme'))||'auto';hist=await hAll();
 const s=await kvGet('session');if(s&&s.v===2){S=s;S.run=false}else if(s)await kvDel('session');if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){console.warn(e)}
 applyTheme();render();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
