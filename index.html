<title>Fit30</title>
<style>
:root{--bg:#EAF0F4;--card:#fff;--tx:#0B1220;--mut:#5B6779;--line:#d3dce5;--ac:#2F6BFF;--rest:#E8960C;--ok:#1FA46B;--sk:#9AA5B5}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#141D30;--tx:#EEF3FA;--mut:#8D9BB3;--line:#243049;--ac:#5B8CFF;--rest:#FFB020;--ok:#3DD08F;--sk:#5C6880}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0;overflow-x:hidden}
main{padding:16px 18px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font:800 34px/1.1 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.03em;margin:8px 0 4px}
h2{font-size:20px;margin:22px 0 10px;letter-spacing:-.01em}
.mut{color:var(--mut)}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats b{display:block;font-size:26px;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:var(--line);border-radius:16px;min-height:52px;padding:0 18px;font-weight:600}
button.p{background:var(--ac);color:#fff;width:100%;min-height:64px;font-size:20px;border-radius:20px}
button.d{background:none;color:#E5484D}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{min-height:44px;background:none;border-radius:11px}.seg button.on{background:var(--card);box-shadow:0 1px 3px #0003}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border-radius:0;min-height:58px;color:var(--mut);font-size:13px}nav button.on{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:20px;border:2px solid transparent;padding:0}
.day small{font-size:11px;font-weight:500;color:var(--mut)}
.day.rest{background:none;border:2px dashed var(--rest);color:var(--rest)}.day.done{background:var(--ok);color:#fff}.day.done small{color:#fffc}
.day.skip{color:var(--sk);text-decoration:line-through}.day.cur{border-color:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet>div{background:var(--bg);width:100%;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.hide{display:none!important}
#tr{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));transition:background .2s}
#tr.rest{--ac:var(--rest)}
#flash{text-align:center;font:800 26px system-ui;height:34px;color:var(--ac)}
#anim{width:100%;max-height:30vh;flex:none}#anim line,#anim circle{stroke:var(--tx)}#anim circle{fill:var(--bg);stroke-width:5}
#tm{font:800 92px/1 -apple-system,"SF Pro Display";letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}.ctl button{font-size:13px;min-height:60px;padding:0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<main id="m"></main>
<nav id="nav"></nav>

</div>
<script>
'use strict';
/* ---------- Trainingsdaten (strukturierter Datensatz) ---------- */
const RAW=`1 30/10 30/10 30/10
2 30/10 32/10 35/10
3 32/10 32/10 35/10
4 32/10 35/10 38/10
5 R
6 34/10 35/10 40/8
7 34/10 38/10 40/8
8 35/10 38/10 42/8
9 R
10 36/10 40/9 45/8
11 36/10 40/9 45/8
12 38/10 42/9 48/8
13 38/10 42/9 48/8
14 R
15 40/10 45/9 50/7
16 40/10 45/9 50/7
17 42/10 48/9 55/7
18 42/10 48/9 55/7
19 R
20 44/10 50/8 58/7
21 44/10 50/8 58/7
22 45/10 52/8 60/7
23 45/10 52/8 60/7
24 R
25 46/10 55/8 62/7
26 48/10 55/8 65/7
27 R
28 48/10 58/8 65/7
29 50/10 60/8 70/7
30 50/10 60/8 70/7`;
const LV=['A','F','P'],LVN={A:'Anfänger',F:'Fortgeschritten',P:'Profi'};
const MX={};RAW.split('\n').forEach(l=>{const t=l.split(' '),d=+t[0];
 if(t[1]==='R'){MX[d]={rest:true};return}
 MX[d]={};LV.forEach((k,i)=>{const[w,r]=t[i+1].split('/').map(Number);MX[d][k]={w,r}})});
const EX=['Jumping Jacks','Squat Hold','Push-ups','Crunches','Glute Bridge','Squats','Close-Grip Push-ups','Plank','High Knees','Lunges','Push-up Rotation','Side Plank links','Side Plank rechts'];
const VAR={
A:['Step Jacks','Moderater Squat Hold','Liegestütze auf den Knien','Kleine Crunches','Klassische Glute Bridge','Teilweise Kniebeugen','Enge Liegestütze auf den Knien','Unterarmstütz auf den Knien','Moderates Knieheben','Rückwärts-Ausfallschritte, kleiner Bewegungsumfang','Knie-Liegestütz mit Rotation','Seitstütz mit angewinkelten Knien'],
F:['Klassische Jumping Jacks','Tiefer Squat Hold','Klassische Liegestütze','Klassische Crunches','Klassische Glute Bridge','Klassische Kniebeugen','Klassische enge Liegestütze','Klassischer Unterarmstütz','Klassischer Kniehebelauf','Klassische Ausfallschritte','Liegestütz mit Rotation','Seitlicher Unterarmstütz'],
P:['Schnelle Jumping Jacks','Tiefer Squat Hold mit erhöhter Muskelspannung','Anspruchsvolle Liegestützvariante','Langsame, kontrollierte Crunches','Einbeinige Glute Bridge','Tiefe Kniebeugen','Anspruchsvolle enge Liegestütze','Dynamischer Plank','Schneller Kniehebelauf','Dynamische Ausfallschritte','Vollständige Liegestützrotation','Seitlicher Unterarmstütz mit angehobenem oberen Bein']};
const varOf=(lv,e)=>VAR[lv][Math.min(e,11)];
const dur=(d,lv)=>{const x=MX[d][lv];return 13*x.w+12*x.r};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtL=s=>Math.floor(s/60)+' Min '+(s%60)+' S';
const buildSegs=(d,lv)=>{const{w,r}=MX[d][lv],s=[];for(let e=0;e<13;e++){s.push({t:'w',e,d:w});if(e<12)s.push({t:'r',e,d:r})}return s};
/* ---------- Animationen: zwei Posen je Übung, lokal per SVG ---------- */
// H,N,P, E1,W1, E2,W2, K1,F1, K2,F2 (x,y)
const JA=[100,20,100,32,100,66,90,48,88,64,110,48,112,64,96,90,94,112,104,90,106,112],JB=[100,20,100,32,100,66,80,24,70,10,120,24,130,10,82,90,68,112,118,90,132,112];
const ST=[100,20,100,32,100,66,110,46,122,40,110,46,122,40,100,90,100,112,100,90,100,112];
const SQ=[96,46,90,58,68,84,106,62,124,58,106,62,124,58,104,86,100,112,104,86,100,112];
const SH=[96,50,90,62,70,80,106,64,124,60,106,64,124,60,104,86,100,112,104,86,100,112];
const U0=[138,66,126,72,80,88,126,92,126,108,126,92,126,108,52,98,24,108,52,98,24,108];
const U1=[138,92,126,96,80,102,112,104,128,108,112,104,128,108,50,106,24,110,50,106,24,110];
const C0=[120,64,118,92,92,102,108,100,128,108,120,100,126,108,52,98,24,108,52,98,24,108];
const CU1=[138,92,126,96,80,102,120,102,128,108,120,102,128,108,50,106,24,110,50,106,24,110];
const CR0=[36,100,46,102,92,104,44,90,38,96,44,90,38,96,112,80,134,104,112,80,134,104],CR1=[58,76,64,86,92,104,66,72,56,72,66,72,56,72,112,80,134,104,112,80,134,104];
const G0=[28,104,40,106,92,106,60,108,80,108,60,108,80,108,122,82,140,106,122,82,140,106],G1=[28,104,40,106,92,76,60,108,80,108,60,108,80,108,124,70,140,106,124,70,140,106];
const PL0=[142,84,128,90,80,98,128,108,146,108,128,108,146,108,52,103,24,108,52,103,24,108],PL1=[142,82,128,86,80,92,128,108,146,108,128,108,146,108,52,100,24,108,52,100,24,108];
const HA=[100,20,100,32,100,66,92,46,104,52,108,48,98,40,116,64,112,88,100,90,100,112],HB=[100,20,100,32,100,66,108,48,98,40,92,46,104,52,100,90,100,112,116,64,112,88];
const L1=[104,40,102,52,100,80,112,64,124,66,112,64,124,66,126,84,128,112,78,100,58,112];
const R1=[138,70,126,74,80,90,126,92,126,108,130,58,130,40,52,98,24,108,52,98,24,108];
const S0=[128,56,118,66,72,94,116,104,136,106,122,54,124,38,44,100,20,108,44,100,20,108],S1=[128,56,118,66,69,86,116,104,136,106,122,54,124,38,44,96,20,108,44,96,20,108];
const mir=a=>a.map((v,i)=>i%2?v:200-v);
const ANI=[[JA,JB,1.1],[SQ,SH,2.6],[U0,U1,2.2],[CR0,CR1,2.4],[G0,G1,2.5],[ST,SQ,2.6],[U0,CU1,2.2],[PL0,PL1,3],[HA,HB,.9],[ST,L1,2.8],[U0,R1,3],[S0,S1,3],[mir(S0),mir(S1),3]];
const sk=document.getElementById('sk');
sk.innerHTML='<circle r="9" id="p0"/>'+[[1,2],[1,3],[3,4],[1,5],[5,6],[2,7],[7,8],[2,9],[9,10]].map((_,i)=>'<line id="l'+i+'"/>').join('');
const LN=[[1,2],[1,3],[3,4],[1,5],[5,6],[2,7],[7,8],[2,9],[9,10]];
let aniEx=0,aniLv='F',aniRAF=0,aniPlay=true;
function pose(e,t){const[a,b]=ANI[e];const p=a.map((v,i)=>v+(b[i]-v)*t);
 document.getElementById('p0').setAttribute('cx',p[0]);document.getElementById('p0').setAttribute('cy',p[1]);
 LN.forEach((l,i)=>{const el=document.getElementById('l'+i);el.setAttribute('x1',p[l[0]*2]);el.setAttribute('y1',p[l[0]*2+1]);el.setAttribute('x2',p[l[1]*2]);el.setAttribute('y2',p[l[1]*2+1])})}
function aniLoop(ts){const per=ANI[aniEx][2]*((aniLv==='P'&&(aniEx==0||aniEx==8))?.7:1);
 pose(aniEx,aniPlay?(1-Math.cos(ts/1000/per*2*Math.PI))/2:0);aniRAF=requestAnimationFrame(aniLoop)}
/* ---------- IndexedDB ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('fit30',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('hist',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const kvGet=k=>tx('kv','readonly',s=>s.get(k)),kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k)),kvDel=k=>tx('kv','readwrite',s=>s.delete(k));
const hAll=()=>tx('hist','readonly',s=>s.getAll()),hAdd=o=>tx('hist','readwrite',s=>s.add(o));
/* ---------- App-Zustand ---------- */
let level='F',skips=[],hist=[],snd=true,theme='auto',tab='home',S=null;
const doneDays=()=>new Set(hist.filter(h=>h.status==='done').map(h=>h.day));
const curDay=()=>{const D=doneDays();for(let d=1;d<=30;d++)if(!MX[d].rest&&!D.has(d)&&!skips.includes(d))return d;return 31};
const $=id=>document.getElementById(id);
function applyTheme(){if(theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme}
/* ---------- Audio (Web Audio, lokal erzeugt) ---------- */
let AC=null;
let HA_=null;
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
 if(!AC)return Promise.resolve();
 const p=AC.state!=='running'?AC.resume():Promise.resolve();
 try{const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}
 if(!HA_){try{const n=8000,v=new DataView(new ArrayBuffer(44+n)),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);HA_=new Audio(URL.createObjectURL(new Blob([v],{type:'audio/wav'})));HA_.loop=true}catch(e){}}
 if(HA_)HA_.play().catch(()=>{});
 return p.catch(()=>{})}
function beep(f,ms=120,at=0,g=.25){if(!snd||!AC)return;const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+at;o.frequency.value=f;o.type='sine';v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+ms/1000+.02)}
const CUE={ws:['Los!',[[880,200]]],we:['Geschafft',[[660,120],[660,120,.16]]],rs:['Pause',[[440,250]]],re:['Weiter',[[880,100],[1175,200,.13]]],tick:['',[[600,70]]],nr:['Neue Runde',[[660,120],[880,120,.14],[1100,200,.28]]],fin:['Training abgeschlossen',[[660,150],[880,150,.18],[1100,150,.36],[1320,400,.54]]]};
function cue(k){const[t,b]=CUE[k];b.forEach(x=>beep(...x));if(t){const f=$('flash');f.textContent=t;f.style.opacity=1;setTimeout(()=>f.style.opacity=.35,900)}if(navigator.vibrate)navigator.vibrate(30)}
/* ---------- Trainingsmotor ---------- */
let timer=0,wl=null,lastSec=-1;
async function wake(){try{if('wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}}catch(e){}}
async function startWorkout(d){await Promise.race([unlock(),new Promise(r=>setTimeout(r,500))]);S={day:d,lv:level,segs:buildSegs(d,level),si:0,remain:0,endAt:0,run:true,log:[],t0:Date.now(),paused:0};beginSeg(true);openTr()}
function openTr(){$('tr').classList.remove('hide');wake();cancelAnimationFrame(aniRAF);aniRAF=requestAnimationFrame(aniLoop);clearInterval(timer);timer=setInterval(tick,200);draw()}
function beginSeg(first){const g=S.segs[S.si];S.remain=g.d*1000;S.endAt=Date.now()+S.remain;S.run=true;lastSec=-1;
 if(g.t==='w'&&g.e===0&&first)cue('ws');else cue(g.t==='w'?'re':'rs');persist();draw()}
function tick(){if(!S)return;if(S.run){S.remain=S.endAt-Date.now();const s=Math.ceil(S.remain/1000);if(s<=3&&s>0&&s!==lastSec){lastSec=s;cue('tick')}if(S.remain<=0)advance(true)}draw()}
function advance(done){const g=S.segs[S.si];if(g.t==='w')S.log.push({ex:EX[g.e],variant:varOf(S.lv,g.e),work:g.d,rest:MX[S.day][S.lv].r,done});
 if(g.t==='w')cue('we');S.si++;if(S.si>=S.segs.length)return finish('done');beginSeg()}
function draw(){if(!S)return;const g=S.segs[S.si],isW=g.t==='w',r=Math.max(0,S.remain)/1000;
 $('tr').classList.toggle('rest',!isW);aniEx=g.e;aniLv=S.lv;aniPlay=isW&&S.run;
 const wi=S.segs.slice(0,S.si+1).filter(x=>x.t==='w').length;
 $('pos').textContent=isW?'Abschnitt '+wi+' von 13':'Pause nach Abschnitt '+wi;$('rnd').textContent='Runde 1 von 1';
 const nxt=isW?S.segs[S.si+1]:g;
 $('nm').textContent=isW?EX[g.e]:'Pause';$('vr').textContent=isW?varOf(S.lv,g.e):'Gleich: '+EX[g.e];
 $('tm').textContent=fmt(r);$('tm').style.color='var(--ac)';
 $('nx').textContent=nxt?(isW?'Danach: Pause '+nxt.d+' s':'Nächste: '+EX[nxt.e]+' · '+MX[S.day][S.lv].w+' s'):'Letzte Übung';
 const tot=S.segs.reduce((a,x)=>a+x.d,0);let left=r;for(let i=S.si+1;i<S.segs.length;i++)left+=S.segs[i].d;
 $('rem').textContent='Gesamt noch '+fmt(left);$('pb').style.width=(100-left/tot*100)+'%';
 $('bP').textContent=S.run?'Pause':'Fortsetzen'}
function persist(){if(S)kvSet('session',JSON.parse(JSON.stringify(S)))}
function pauseW(){if(S&&S.run){S.remain=Math.max(0,S.endAt-Date.now());S.run=false;persist();draw()}}
function resumeW(){unlock();if(S&&!S.run){S.endAt=Date.now()+S.remain;S.run=true;wake();persist();draw()}}
async function finish(status){clearInterval(timer);cancelAnimationFrame(aniRAF);const e=S;S=null;
 await hAdd({date:new Date().toISOString(),day:e.day,level:e.lv,status,segments:e.log,planned:buildSegs(e.day,e.lv).length,total:Math.round((Date.now()-e.t0)/1000),plannedTotal:dur(e.day,e.lv)});
 await kvDel('session');hist=await hAll();setTimeout(()=>{if(HA_)HA_.pause()},2500);if(wl){wl.release();wl=null}
 if(status==='done')cue('fin');$('tr').classList.add('hide');render()}
$('bP').onclick=()=>S.run?pauseW():resumeW();
$('bR').onclick=()=>{if(S){const g=S.segs[S.si];S.remain=g.d*1000;S.endAt=Date.now()+S.remain;lastSec=-1;persist();draw()}};
$('bS').onclick=()=>{if(S){const g=S.segs[S.si];if(g.t==='w'){S.log.push({ex:EX[g.e],variant:varOf(S.lv,g.e),work:0,rest:0,done:false});}S.si++;if(S.si>=S.segs.length)finish('done');else beginSeg()}};
$('bA').onclick=()=>{if(S&&confirm('Training wirklich abbrechen?'))finish('aborted')};
document.addEventListener('visibilitychange',()=>{if(S){if(document.hidden)pauseW();else if(S.run)wake()}if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
addEventListener('pagehide',pauseW);
/* ---------- Ansichten ---------- */
const NAVI=[['home','Heute'],['cal','Kalender'],['his','Verlauf'],['set','Mehr']];
function render(){$('nav').innerHTML=NAVI.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
 $('m').innerHTML=({home:vHome,cal:vCal,his:vHis,set:vSet})[tab]();window.scrollTo(0,0)}
window.go=t=>{tab=t;render()};
window.setLv=l=>{level=l;kvSet('level',l);render()};
function vHome(){const d=curDay(),D=doneDays(),n=D.size,tr=24-n-skips.filter(x=>!D.has(x)).length;
 const nr=Object.keys(MX).map(Number).find(x=>MX[x].rest&&x>(d>30?30:d));
 let h='';if(S)h+=`<div class="card"><b>Unterbrochenes Training</b><br><span class="mut">Tag ${S.day} · ${LVN[S.lv]} · noch ${fmt(S.remain/1000)} im aktuellen Abschnitt</span><br><br><button class="p" onclick="resumeUI()">Fortsetzen</button></div>`;
 if(d>30)return h+`<h1>Geschafft.</h1><p class="mut">Alle Trainingstage des 30-Tage-Programms sind abgeschlossen oder übersprungen.</p>`+lvSeg();
 const restToday=MX[d-1]&&MX[d-1].rest&&!D.has(d)?'<p class="mut">Gestern war Ruhetag. Heute geht es weiter.</p>':'';
 return h+`<h1>Tag ${d} von 30</h1><div class="mut">${D.has(d)?'Absolviert':'Geplantes Training'} · ${LVN[level]}</div>${restToday}
 <div class="card"><div class="bar"><i style="width:${n/24*100}%"></i></div>
 <div class="stats"><div><b>${n}</b><span class="mut">absolviert</span></div><div><b>${tr}</b><span class="mut">verbleibend</span></div><div><b>${nr?'Tag '+nr:'–'}</b><span class="mut">nächste Ruhe</span></div></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between"><b>13 Abschnitte</b><span>${fmtL(dur(d,level))}</span></div>
 <div class="mut">${MX[d][level].w} s Belastung · ${MX[d][level].r} s Pause · 1 Runde</div></div>
 <button class="p" onclick="startWorkout(${d})">Training starten</button>`+lvSeg()}
const lvSeg=()=>`<h2>Fitnesslevel</h2><div class="seg">${LV.map(l=>`<button class="${level===l?'on':''}" onclick="setLv('${l}')">${LVN[l]}</button>`).join('')}</div><p class="mut" style="font-size:14px">Du kannst das Level jederzeit wechseln. Gespeicherte Ergebnisse bleiben erhalten.</p>`;
window.resumeUI=()=>{unlock();openTr()};
function vCal(){const D=doneDays(),c=curDay();
 return `<h1>Kalender</h1><p class="mut">6 Ruhetage: 5, 9, 14, 19, 24, 27</p><div class="cal">`+Array.from({length:30},(_,i)=>{const d=i+1,r=MX[d].rest;
 const cl=r?'rest':D.has(d)?'done':skips.includes(d)?'skip':'';
 return `<button class="day ${cl} ${d===c?'cur':''}" onclick="dayInfo(${d})">${d}<small>${r?'Ruhe':D.has(d)?'fertig':skips.includes(d)?'übersprungen':'Training'}</small></button>`}).join('')+`</div>`}
window.dayInfo=d=>{const x=MX[d];let h=`<h1 style="font-size:28px">Tag ${d}</h1>`;
 if(x.rest)h+='<p>Ruhetag. Vollständig trainingsfrei – Erholung gehört zum Programm.</p>';
 else{h+='<table><tr><th>Level</th><th>Belastung/Pause</th><th>Dauer</th></tr>'+LV.map(l=>`<tr><td>${LVN[l]}</td><td>${x[l].w}/${x[l].r} s</td><td>${fmt(dur(d,l))}</td></tr>`).join('')+'</table>';
  h+=`<p class="mut">Status: ${doneDays().has(d)?'absolviert':skips.includes(d)?'übersprungen':'geplant'}. Variante (${LVN[level]}): ${VAR[level].slice(0,3).join(', ')} …</p>`;
  h+=`<button class="p" onclick="closeSh();startWorkout(${d})">Training starten</button><br><br><button onclick="toggleSkip(${d})">${skips.includes(d)?'Überspringen aufheben':'Tag überspringen'}</button> `}
 h+=`<button onclick="closeSh()">Schließen</button>`;$('sh').innerHTML=h;$('sheet').classList.remove('hide')};
window.closeSh=()=>$('sheet').classList.add('hide');
window.toggleSkip=async d=>{skips=skips.includes(d)?skips.filter(x=>x!==d):[...skips,d];await kvSet('skips',skips);closeSh();render()};
function vHis(){const H=hist.slice().reverse(),dn=hist.filter(h=>h.status==='done');
 const mx=Math.max(1,...dn.map(h=>h.total));
 const ch=dn.length?`<svg viewBox="0 0 ${Math.max(dn.length*22,200)} 90" style="width:100%"><g>`+dn.map((h,i)=>`<rect x="${i*22+2}" y="${85-h.total/mx*80}" width="18" height="${h.total/mx*80}" rx="4" fill="var(--ac)"/>`).join('')+`</g></svg><div class="mut" style="font-size:13px">Gesamtdauer je Einheit (längste ${fmt(mx)})</div>`:'<p class="mut">Noch kein Training gespeichert.</p>';
 const cmp=[1,30].map(d=>{const x=MX[d][level],s=dn.filter(h=>h.day===d).pop();return `<tr><td>Tag ${d}</td><td>${x.w}/${x.r} s</td><td>${fmt(dur(d,level))}</td><td>${s?fmt(s.total):'–'}</td></tr>`}).join('');
 return `<h1>Verlauf</h1><div class="card">${ch}</div><h2>Tag 1 und Tag 30 (${LVN[level]})</h2><div class="card"><table><tr><th></th><th>Bel./Pause</th><th>Plan</th><th>Dein Wert</th></tr>${cmp}</table></div>
 <h2>Einheiten</h2>`+(H.map(h=>`<div class="row"><div><b>Tag ${h.day}</b> · ${LVN[h.level]}<br><span class="mut" style="font-size:14px">${new Date(h.date).toLocaleDateString('de-DE')} · ${h.segments.filter(s=>s.done).length}/13 Übungen</span></div><div>${h.status==='done'?fmt(h.total):'abgebrochen'}</div></div>`).join('')||'<p class="mut">Keine Einträge.</p>')}
function vSet(){return `<h1>Mehr</h1>
 <div class="row"><span>Töne</span><button onclick="tgSnd()">${snd?'An':'Aus'}</button></div>
 <div class="row"><span>Ton testen</span><button onclick="testSnd()">Abspielen</button></div>
 <div class="row"><span>Design</span><button onclick="tgTheme()">${{auto:'Automatisch',dark:'Dunkel',light:'Hell'}[theme]}</button></div>
 <div class="row"><span>Daten exportieren (JSON)</span><button onclick="exp()">Export</button></div>
 <div class="row"><span>Alle Daten löschen</span><button class="d" onclick="wipe()">Löschen</button></div>
 <p class="mut" style="font-size:14px">Alle Daten bleiben auf diesem Gerät (IndexedDB). Keine Registrierung, keine Cloud, kein Tracking. Beim Wechsel in eine andere App wird das Training automatisch pausiert und die Restzeit gespeichert.</p>`}
window.testSnd=()=>{unlock().then(()=>{if(!snd){alert('Töne sind ausgeschaltet.');return}cue('ws');setTimeout(()=>cue('re'),600)})};
window.tgSnd=()=>{snd=!snd;kvSet('snd',snd);unlock();if(snd)beep(880);render()};
window.tgTheme=()=>{theme={auto:'dark',dark:'light',light:'auto'}[theme];kvSet('theme',theme);applyTheme();render()};
window.exp=async()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),level,skips,history:hist,matrix:MX},null,1)],{type:'application/json'});const f=new File([blob],'fit30-export.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fit30-export.json';a.click()};
window.wipe=async()=>{if(!confirm('Wirklich alle Trainingsdaten löschen?'))return;const d=await db;d.close();indexedDB.deleteDatabase('fit30');location.reload()};
/* ---------- Start ---------- */
(async()=>{try{level=(await kvGet('level'))||'F';skips=(await kvGet('skips'))||[];snd=(await kvGet('snd'))!==false;theme=(await kvGet('theme'))||'auto';hist=await hAll();
 const s=await kvGet('session');if(s){S=s;S.run=false}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){console.warn(e)}
 applyTheme();render();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
